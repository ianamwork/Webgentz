<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webgentz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" data-theme="day">
    <canvas id="world"></canvas>

    <!-- layer labels -->
    <div class="layer-lbl" id="ll-canopy"     style="top:22%;left:16px;pointer-events:none;"></div>
    <div class="layer-lbl" id="ll-understory" style="top:47%;left:16px;pointer-events:none;"></div>
    <div class="layer-lbl" id="ll-roots"      style="top:78%;left:16px;pointer-events:none;"></div>

    <!-- HUD top bar -->
    <header id="hud"></header>

    <!-- time-of-day popover -->
    <div id="time-pop" hidden></div>

    <!-- hover cards -->
    <div id="hover-card" hidden></div>
    <div id="bank-tip"  hidden></div>
    <div id="board-tip" hidden></div>

    <!-- agent detail sheet -->
    <aside id="agent-sheet" hidden></aside>

    <!-- ledger (tab when closed, drawer when open) -->
    <div id="ledger-wrap"></div>

    <!-- modals -->
    <div id="modal-back" hidden></div>
    <div id="quest-panel" hidden></div>
    <div id="bank-panel"  hidden></div>
  </div>

  <script src="jungle-engine.js"></script>
  <script src="demo.js"></script>
  <script src="world.js"></script>
</body>
</html>
